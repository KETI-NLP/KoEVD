[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "koevd-eval"
version = "0.3.0rc22"
description = "Reference evaluation and analysis for KoEVD"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
dev = ["jsonschema>=4.20", "httpx>=0.27"]
hub = ["huggingface-hub>=0.34"]
storage = ["huggingface-hub>=1.31", "boto3>=1.40,<2"]
analysis = ["numpy>=1.26", "pandas>=2.2", "matplotlib>=3.8", "seaborn>=0.13"]
classifiers = ["torch>=2.4", "transformers>=5.8.1", "peft>=0.18", "accelerate>=1.0", "sentencepiece", "huggingface-hub>=0.34"]
serve = ["fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
koevd-prepare = "koevd_eval.prepare_tasks:main"
koevd-run = "koevd_eval.run_openai_compatible:main"
koevd-score = "koevd_eval.score:main"
koevd-classify = "koevd_eval.classify_responses:main"
koevd-download = "koevd_eval.hub:main"
koevd-analyze = "koevd_eval.analysis:main"
koevd-pipeline = "koevd_eval.pipeline:main"
koevd-results = "koevd_eval.results:main"
koevd-doctor = "koevd_eval.preflight:main"
koevd-diagnose = "koevd_eval.diagnostics:main"
koevd-space = "koevd_eval.spaces:main"
koevd-audit = "koevd_eval.measurement_audit:main"
koevd-submissions = "koevd_eval.submissions:main"
koevd-policy = "koevd_eval.policy_decisions:main"
koevd-snapshot = "koevd_eval.snapshots:main"
koevd-recovery = "koevd_eval.recovery:main"
koevd-backup = "koevd_eval.backups:main"

[tool.setuptools]
license-files = ["LICENSE", "LICENSES/*.md", "NOTICE.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
koevd_eval = ["schemas/*.json", "assets/*.css", "assets/*.js", "assets/*.html", "assets/*.json"]
